# CodeQL static analysis (SAST) — free on public repos. Scans the TypeScript edge
# functions and the Python backend for injection, auth, and other vuln classes on
# every push/PR + weekly. (Dart/Flutter isn't a CodeQL language; the client is
# covered by `flutter analyze` + the health-hub-reviewer + gitleaks.)
name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1'   # Mondays 02:30 UTC
permissions:
  security-events: write
  contents: read
  actions: read
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
