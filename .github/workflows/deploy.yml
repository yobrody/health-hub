name: Deploy to Cloudflare Pages

# Auto-deploys to Cloudflare Pages on every push to main. Replaces the manual
# Direct-Upload-via-dashboard flow that was breaking because CF Pages doesn't
# auto-compile functions/ for Direct Upload — only for Git deploys + wrangler.
#
# Secrets required (Repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN — Pages Edit token from CF dashboard
#   CLOUDFLARE_ACCOUNT_ID — your CF account id (visible in dashboard URL or
#                          top-right of any account page)
#
# Project name in CF is `health-hub` (subdomain `health-hub-dwz.pages.dev`
# is auto-generated and is NOT the project name).

on:
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger from the Actions tab if needed.

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: build + deploy to CF Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `wrangler pages deploy <dir>` reads functions/ from CWD automatically
          # so the Pages Functions get compiled and bundled correctly. Branch
          # `main` makes this a Production deployment (vs preview).
          command: pages deploy dist --project-name=health-hub --branch=main
