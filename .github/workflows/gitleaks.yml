name: gitleaks
# Secret scanning — fails the build if a credential is ever committed.
# Now that the repo is PUBLIC this is important: it scans the FULL history on
# every push/PR (fetch-depth 0), so a leaked key surfaces immediately.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full git history for a complete scan
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE needed for a public / personal repo.
